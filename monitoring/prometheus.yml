# Prometheus 스크래핑 설정
# 15초마다 대상들의 /metrics(우리 앱은 /actuator/prometheus)를 긁어와 저장한다.
global:
  scrape_interval: 15s

scrape_configs:
  # 우리 스프링부트 앱: 호스트에서 실행(./gradlew bootRun) → 도커 안 Prometheus 기준 host.docker.internal
  - job_name: 'driving-reservation'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  # Prometheus 자기 자신도 수집(정상 동작 확인용)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
