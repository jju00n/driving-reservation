services:
  mysql:
    image: mysql:8.0
    container_name: driving-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: driving_reservation
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: driving-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
