# ConfigMap: 민감하지 않은 설정값(접속 주소 등)을 이미지 밖에서 주입
# 비밀번호/토큰 같은 민감정보는 여기 두지 않고 Secret(secret.yaml)에 둔다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: driving-reservation-config
  labels:
    app: driving-reservation
data:
  # DB 접속 (비번은 Secret) — 클러스터 내 MySQL 서비스명 기준(예시)
  DB_URL: "jdbc:mysql://mysql:3306/driving_reservation?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
  DB_USERNAME: "driving"
  # Redis 접속 — 클러스터 내 Redis 서비스명 기준(예시)
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # 토스 API 엔드포인트(공개 정보 — 키만 Secret)
  TOSS_BASE_URL: "https://api.tosspayments.com"
