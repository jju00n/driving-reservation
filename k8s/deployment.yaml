# Deployment: "이 앱을 파드 N개로 항상 유지해라"를 선언
# → 파드가 죽으면 자동 재시작(self-healing), 배포 시 무중단 롤링 업데이트
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driving-reservation
  labels:
    app: driving-reservation
spec:
  replicas: 2                      # 파드 2개 유지 (하나 죽어도 서비스 지속)
  selector:
    matchLabels:
      app: driving-reservation     # 아래 template 라벨과 매칭돼 이 파드들을 관리
  template:
    metadata:
      labels:
        app: driving-reservation   # Service가 이 라벨로 파드를 찾음
    spec:
      # 앱이 DB/Kafka 보다 먼저 뜨면 HikariCP 가 첫 커넥션 실패로 즉시 죽는다(fail-fast 가 기본값).
      # k8s 가 재시작해주긴 하지만 CrashLoopBackOff 의 지수 백오프가 붙어 기동이 분 단위로 늘어지고,
      # 로그에는 "앱 버그"와 구분되지 않는 스택트레이스만 쌓인다.
      # 의존성 포트가 열릴 때까지 기다렸다가 본 컨테이너를 시작한다.
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do echo "waiting for mysql..."; sleep 2; done
              until nc -z redis 6379; do echo "waiting for redis..."; sleep 2; done
              until nc -z kafka-0.kafka 9092; do echo "waiting for kafka..."; sleep 2; done
              echo "all dependencies reachable"
          # QoS 는 initContainer 를 포함한 "모든" 컨테이너가 requests == limits 여야 Guaranteed 가 된다.
          # 여기만 다르게 두면 파드 전체가 Burstable 로 떨어진다(실제로 그렇게 나와서 맞춘 값).
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: app
          # 태그를 latest 로 두면 imagePullPolicy 기본값이 Always 가 되어, 노드에 이미지를 올려놔도
          # 레지스트리를 다시 보러 갔다가 ErrImagePull 로 떨어진다. 고정 태그 + IfNotPresent 로 둔다.
          image: driving-reservation:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # 설정/민감정보는 이미지 밖에서 주입
          #   - ConfigMap: 비민감 접속정보(DB_URL/USERNAME, REDIS_HOST/PORT, TOSS_BASE_URL)
          #   - Secret: 민감정보(DB_PASSWORD, JWT_SECRET, TOSS_SECRET_KEY)
          # 두 리소스의 key가 그대로 컨테이너 환경변수가 되어 application-prod.yml의 ${...}로 주입됨
          envFrom:
            - configMapRef:
                name: driving-reservation-config
            - secretRef:
                name: driving-reservation-secret
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          # 리소스 요청/제한 → 스케줄링·과점유 방지
          # requests == limits 로 맞춰 QoS 를 Guaranteed 로 만든다.
          # Burstable(requests < limits)은 노드 메모리가 달릴 때 kubelet 이 먼저 골라 죽인다.
          # 결제·예약처럼 중간에 끊기면 정합성 보정이 필요한 워크로드는 가장 마지막에 밀려나야 한다.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          # 기동이 끝났나? Spring Boot 는 DB·Redis·Kafka 커넥션까지 잡느라 시작이 길다.
          # 이 프로브가 통과하기 전까지 liveness/readiness 는 아예 돌지 않으므로,
          # "느리게 뜨는 것"과 "죽은 것"을 구분하지 못해 재시작 루프에 빠지는 걸 막는다.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30       # 5초 × 30 = 최대 150초까지 기동 허용
          # 살아있나? 죽었으면 재시작 (self-healing)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3        # 연속 3회 실패해야 재시작 — 순간 지연으로 멀쩡한 파드를 죽이지 않게
          # 트래픽 받을 준비됐나? 안 됐으면 라우팅 제외
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
