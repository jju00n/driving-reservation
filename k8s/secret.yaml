# Secret: 민감정보(DB 비번, JWT 시크릿, 토스 키)를 이미지 밖에서 주입
#
# ⚠️ 중요: 아래 값은 전부 "치환 대상 placeholder"다. 실제 값을 이 파일에 적어 커밋하지 말 것.
#   - Secret은 "암호화"가 아니라 base64 "인코딩"일 뿐 → 저장소에 올리면 노출된 것과 같다.
#   - 실무는 Sealed Secrets / HashiCorp Vault / External Secrets 사용. 이 프로젝트는 사이드라 예시로만.
#
# 실제 배포 시 실값 주입 방법(택1):
#   1) 이 파일 대신 CLI로 생성(권장):
#        kubectl create secret generic driving-reservation-secret \
#          --from-literal=DB_PASSWORD=<실제값> \
#          --from-literal=JWT_SECRET=<실제값> \
#          --from-literal=TOSS_SECRET_KEY=<실제값>
#   2) 이 파일을 복사해 값만 바꾸고 커밋에서 제외(.gitignore)
apiVersion: v1
kind: Secret
metadata:
  name: driving-reservation-secret
  labels:
    app: driving-reservation
type: Opaque
stringData:                        # stringData = 평문으로 적으면 k8s가 저장 시 base64 인코딩(가독성 위해 data 대신 사용)
  DB_PASSWORD: REPLACE_AT_DEPLOY
  JWT_SECRET: REPLACE_AT_DEPLOY
  TOSS_SECRET_KEY: REPLACE_AT_DEPLOY
