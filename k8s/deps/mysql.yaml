# MySQL — StatefulSet 으로 띄운다.
#
# 왜 Deployment 가 아닌가:
#   Deployment 는 파드를 재생성할 때 이름이 바뀌고(예: -7d9f...), 볼륨을 파드마다 고정해 붙일 수단이 없다.
#   DB 는 "파드보다 데이터가 오래 살아야" 하므로, 이름이 고정되고(mysql-0)
#   volumeClaimTemplates 로 파드별 PVC 가 따라붙는 StatefulSet 이 맞다.
#   파드가 죽었다 살아나도 같은 PVC 에 다시 붙어 예약·결제 이력이 남는다.
---
# Headless Service (clusterIP: None)
#   StatefulSet 의 serviceName 이 가리키는 서비스. 로드밸런싱 없이 DNS 가 파드 IP 로 바로 해석된다.
#   앱은 ConfigMap 의 DB_URL(jdbc:mysql://mysql:3306/...) 로 이 이름을 찾는다.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# 서버·클라이언트 charset 고정.
#
# 왜 필요한가: mysql:8.0 이미지의 엔트리포인트는 /docker-entrypoint-initdb.d 의 .sql 을
# mysql CLI 로 실행하는데, 이 CLI 세션의 기본 charset 이 utf8mb4 가 아니다.
# 그러면 schema.sql/data.sql 안의 한글(UTF-8 바이트)이 latin1 로 읽혀 이중 인코딩된 채 적재된다.
# 서버 컬럼은 utf8mb4 이므로 에러 없이 "깨진 글자 그대로" 저장되고, 앱은 그걸 정직하게 읽어 내보낸다.
# → 앱을 아무리 봐도 원인이 안 나오는 유형. [client]/[mysql] 섹션이 그 CLI 에 적용된다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-charset
  labels:
    app: mysql
data:
  charset.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_0900_ai_ci
    [client]
    default-character-set=utf8mb4
    [mysql]
    default-character-set=utf8mb4
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  serviceName: mysql
  replicas: 1                    # 단일 노드(학습용). 운영이면 복제 구성 + 백업이 따로 필요
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            # DB 자체의 root 자격증명 — 앱이 쓰는 계정과 분리한다(앱은 driving 계정만 안다)
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: driving_reservation
            - name: MYSQL_USER
              value: driving              # ConfigMap 의 DB_USERNAME 과 일치해야 함
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: TZ
              value: Asia/Seoul
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # 최초 기동 시 1회 실행되는 초기화 스크립트.
            # prod 프로파일은 sql.init.mode=never 라 앱이 스키마를 만들지 않는다 → DB 쪽에서 넣어준다.
            # 파일명이 01-/02- 로 시작하는 이유: 이 디렉토리는 알파벳 순으로 실행돼서
            # 이름을 안 붙이면 data.sql 이 schema.sql 보다 먼저 돌아 "테이블 없음"으로 깨진다.
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            # initdb 스크립트가 실행되기 전에 charset 이 잡혀 있어야 한다
            - name: charset
              mountPath: /etc/mysql/conf.d
          # 준비됐나? mysqld 가 소켓을 열어도 초기화 스크립트가 도는 동안은 접속이 거부된다.
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12        # 초기화 스크립트 도는 시간(최대 60초)까지는 실패로 안 봄
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: initdb
          configMap:
            name: mysql-initdb
        - name: charset
          configMap:
            name: mysql-charset
  # 파드별 PVC 를 자동 생성. 파드를 지웠다 다시 만들어도 이 PVC 는 살아남는다.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
