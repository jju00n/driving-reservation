spring:
  application:
    name: driving-reservation
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 20s   # graceful 종료 시 처리중 요청 최대 20초 대기(결제/예약 트랜잭션 중 파드 강제종료 방지)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    user:
      name: admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # 값은 JSON 문자열(타입 헤더 의존 없음 → 스키마 변경에 덜 취약)
      acks: all                    # 리더 + ISR 전부 기록 확인 후 성공 처리(단일 노드라 실효는 리더뿐이지만 의도를 설정으로 남김)
      properties:
        enable.idempotence: true   # 프로듀서 재시도 시 브로커가 중복 레코드를 제거(같은 메시지가 두 번 쌓이는 것 방지)
        delivery.timeout.ms: 5000  # 발행 총 제한. 웹훅 응답 경로라 오래 못 기다림 — 실패분은 재발행 스케줄러가 회수
        request.timeout.ms: 2000
    consumer:
      group-id: webhook-processor
      auto-offset-reset: earliest      # 그룹 최초 기동 시 처음부터. latest 면 기동 전 쌓인 웹훅을 통째로 건너뜀
      enable-auto-commit: false        # 핵심: 자동 커밋이면 "처리 전"에 커밋돼 유실 → 아래 ack-mode 로 처리 후 커밋
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record       # 리스너 메서드가 예외 없이 끝난 레코드만 커밋(실패 시 커밋 안 됨 → 재소비)
      concurrency: 3         # 파티션 수와 동일. 이보다 많이 띄우면 남는 컨슈머는 논다

server:
  shutdown: graceful                  # SIGTERM 수신 시 새 요청 차단 + 처리중 요청 마무리

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus   # health·info·prometheus만 공개(env/beans/heapdump 등 민감 엔드포인트 비공개)
  endpoint:
    health:
      probes:
        enabled: true                 # /actuator/health/liveness, /readiness 활성화(k8s probe용)
      show-details: never             # 내부 컴포넌트 상세는 외부 비노출(보안)
      group:
        readiness:
          include: readinessState, redis, db   # Redis·DB 연결까지 준비 판정에 포함 → 끊기면 트래픽 라우팅 제외
  metrics:
    tags:
      application: ${spring.application.name}   # 모든 메트릭에 application 라벨 부착 → Grafana "Unknown" 해결·다중 앱 구분
    web:
      server:
        max-uri-tags: 50            # URI 태그 카디널리티 상한. 초과분은 하나로 묶여 폭증 방지(사라지는 게 아님)
    distribution:
      percentiles-histogram:
        http.server.requests: true    # HTTP 지연 히스토그램 버킷 생성 → Grafana에서 p95/p99 계산 가능
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long}
  expiration: 3600000        # 1시간 (ms)
  refresh-expiration: 604800000  # 7일 (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

webhook:
  kafka:
    topic: payment.webhook.received
    partitions: 3              # 컨슈머 병렬도 상한. 파티션 키(orderId) 단위로만 순서가 보장된다
    retry:
      attempts: 3              # 컨슈머 처리 실패 시 재시도 횟수(이후 DLT 로 격리)
      initial-backoff-ms: 1000 # 1초 → 2초 → 4초 (DB 순간 장애 정도는 이걸로 회복)
      multiplier: 2.0
  republish:
    scan-interval-ms: 60000    # 재발행 스케줄러 주기(1분)
    stale-minutes: 5           # RECEIVED 상태로 5분 이상 잔류 = 발행 실패로 간주하고 재발행

reservation:
  payment-pending-ttl-minutes: 30  # 우리 미결제 만료 정책(토스 결제창 30분과 일치)
  expiration:
    scan-interval-ms: 60000   # 만료 스케줄러 주기(1분)
    overdue-minutes: 40       # reservedAt + 40분 초과 PENDING 청소(토스 30+10분보다 여유)

toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_dummy}   # 운영은 환경변수 주입(테스트는 Mock이라 미사용)
  base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
  connect-timeout: 2s
  read-timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      tossPayments:                              # @CircuitBreaker(name="tossPayments")와 매칭되는 인스턴스명
        register-health-indicator: true          # /actuator/health 에 서킷 상태(OPEN/CLOSED) 노출
        sliding-window-type: COUNT_BASED         # 최근 "호출 건수" 기준 집계 (시간 기준 TIME_BASED 아님)
        sliding-window-size: 10                  # 집계 윈도우 크기 = 최근 10건
        minimum-number-of-calls: 5               # 최소 5건 쌓이기 전엔 실패율 평가 안 함 (표본 부족 시 성급한 오픈 방지)
        failure-rate-threshold: 50               # 실패율 50% 초과 시 OPEN (5xx/타임아웃만 실패로 집계)
        wait-duration-in-open-state: 5s          # OPEN 유지 시간. 5초간 호출 차단 후 HALF_OPEN 으로 전환
        permitted-number-of-calls-in-half-open-state: 3   # HALF_OPEN 에서 허용하는 시험 호출 수. 이 3건으로 복구 판정
        automatic-transition-from-open-to-half-open-enabled: true   # 요청 없이도 5초 경과 시 타이머로 자동 HALF_OPEN 전환
        # 카드 거절 등 비즈니스 거절(4xx)은 서킷 집계에서 제외 — 게이트웨이 장애에만 반응
        ignore-exceptions:                       # 여기 등록된 예외는 실패로 안 침 (정상 비즈니스 흐름이므로)
          - com.example.driving.payment.exception.TossPaymentException   # 4xx 카드 거절
