spring:
  application:
    name: driving-reservation
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    user:
      name: admin

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long}
  expiration: 3600000        # 1시간 (ms)
  refresh-expiration: 604800000  # 7일 (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

reservation:
  payment-pending-ttl-minutes: 30  # 우리 미결제 만료 정책(토스 결제창 30분과 일치)
  expiration:
    scan-interval-ms: 60000   # 만료 스케줄러 주기(1분)
    overdue-minutes: 40       # reservedAt + 40분 초과 PENDING 청소(토스 30+10분보다 여유)

toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_dummy}   # 운영은 환경변수 주입(테스트는 Mock이라 미사용)
  base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
  connect-timeout: 2s
  read-timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      tossPayments:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50          # 5xx/타임아웃 비율 50% 초과 시 오픈
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 카드 거절 등 비즈니스 거절(4xx)은 서킷 집계에서 제외 — 게이트웨이 장애에만 반응
        ignore-exceptions:
          - com.example.driving.payment.exception.TossPaymentException
