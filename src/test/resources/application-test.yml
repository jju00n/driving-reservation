spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
  kafka:
    consumer:
      # 테스트는 컨테이너를 매번 새로 띄우므로 그룹 오프셋이 없다 → earliest 로 처음부터 읽는다.
      auto-offset-reset: earliest

webhook:
  kafka:
    retry:
      initial-backoff-ms: 100   # 운영 1000ms. 테스트에서 재시도 3회를 0.7초 안에 끝내려고 단축
  republish:
    scan-interval-ms: 1000      # 재발행 스케줄러 검증용(잔류 판정은 stale-minutes 로 별도 제어)
    stale-minutes: 60           # 기본은 안 걸리게 크게 — 필요한 테스트에서만 프로퍼티로 낮춘다

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    com.example.driving: INFO
